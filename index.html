<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>جاري فتح التطبيق...</title>
    <script>
        window.onload = function() {
            // استخراج الـ ID من رابط الويب
            const urlParams = new URLSearchParams(window.location.search);
            const postId = urlParams.get('id');
            
            if (postId) {
                // تحويل المتصفح لفتح الرابط المخصص في التطبيق فوراً
                window.location.href = "mareb://post?id=" + postId;
                
                // خطة بديلة (Fallback) إذا لم يكن التطبيق ثابتاً في الهاتف بعد ثانيتين
                setTimeout(function() {
                    window.location.href = "https://play.google.com/store/apps/details?id=com.shaban.dalil";
                }, 2000);
            }
        }
    </script>
</head>
<body>
    <div style="text-align: center; margin-top: 50px; font-family: sans-serif;">
        <h2>جاري توجيهك إلى تطبيق دليل مأرب...</h2>
        <p>إذا لم يفتح التطبيق تلقائياً، تأكد من تثبيته من متجر جوجل بلاي.</p>
    </div>
</body>
</html>
