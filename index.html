<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري فتح تطبيق دليل مأرب...</title>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #002547; /* اللون الكحلي لهوية التطبيق */
            font-family: sans-serif;
            color: #ffffff;
            text-align: center;
        }
        .container {
            padding: 20px;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #EDC737; /* اللون الذهبي للهوية */
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        h2 {
            margin: 0 0 10px 0;
            font-size: 22px;
        }
        p {
            color: #A0A0A0;
            margin: 0;
            font-size: 14px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>

    <script>
        window.onload = function() {
            // استخراج معرف المنشور (id) من الرابط القادم من الواتساب
            const urlParams = new URLSearchParams(window.location.search);
            const postId = urlParams.get('id');
            
            if (postId) {
                // محاولة توجيه الهاتف لفتح التطبيق مباشرة عبر الرابط العميق المخصص
                window.location.href = "mareb://post?id=" + postId;
                
                // خطة بديلة (Fallback): إذا لم يفتح التطبيق خلال ثانيتين (بسبب عدم تثبيته مثلاً)
                // سيتم تحويل المستخدم تلقائياً إلى صفحة التطبيق على متجر جوجل بلاي
                setTimeout(function() {
                    window.location.href = "https://play.google.com/store/apps/details?id=com.shaban.dalil";
                }, 2000);
            } else {
                // إذا دخل المستخدم للرابط الأساسي بدون رقم منشور، يتم تحويله للمتجر مباشرة
                window.location.href = "https://play.google.com/store/apps/details?id=com.shaban.dalil";
            }
        }
    </script>
</head>
<body>

    <div class="container">
        <div class="loader"></div>
        <h2>جاري الانتقال إلى تطبيق دليل مأرب...</h2>
        <p>إذا لم يفتح التطبيق تلقائياً، تأكد من تثبيته من متجر جوجل بلاي.</p>
    </div>

</body>
</html>
