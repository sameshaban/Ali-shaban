<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري فتح تطبيق دليل مأرب...</title>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #002547;
            font-family: sans-serif;
            color: #ffffff;
            text-align: center;
        }
        .container {
            padding: 20px;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #EDC737;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        h2 {
            margin: 0 0 10px 0;
            font-size: 22px;
        }
        p {
            color: #A0A0A0;
            margin: 0;
            font-size: 14px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>

    <script>
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const postId = urlParams.get('id');
            
            if (postId) {
                // محاولة فتح التطبيق مباشرة
                window.location.href = "mareb://post?id=" + postId;
                
                // خطة بديلة مؤقتة: التوجيه لرابط تحميل مباشر بدلاً من متجر جوجل بلاي لحين نشر التطبيق
                setTimeout(function() {
                    // ضع هنا رابطاً مؤقتاً (مثل رابط جوجل درايف يحتوي على الـ APK أو أي رابط بديل تفضله)
                    window.location.href = "https://drive.google.com/drive/folders/your_folder_link";
                }, 2000);
            } else {
                // التوجيه للرابط البديل في حال عدم وجود معرف منشور
                window.location.href = "https://drive.google.com/drive/folders/your_folder_link";
            }
        }
    </script>
</head>
<body>

    <div class="container">
        <div class="loader"></div>
        <h2>جاري الانتقال إلى تطبيق دليل مأرب...</h2>
        <p>إذا لم يفتح التطبيق تلقائياً، يمكنك تحميل أحدث إصدار من الرابط البديل.</p>
    </div>

</body>
</html>
